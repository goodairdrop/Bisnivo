<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bisnivo - Kelola Bisnis Lebih Mudah</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f7fb;color:#17233c}
header{background:#fff;padding:17px 6%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 12px #17233c10}
.logo{font-size:25px;font-weight:bold;color:#1765db}
.logo span{color:#19a5a0}
nav a{margin-left:20px;text-decoration:none;color:#34415a;font-size:14px}
.hero{padding:65px 7%;background:linear-gradient(135deg,#e8f1ff,#f7fbff);display:flex;align-items:center;gap:35px;flex-wrap:wrap}
.hero-text{flex:1;min-width:260px}
.badge{display:inline-block;background:#dceaff;color:#1765db;padding:8px 13px;border-radius:20px;font-size:12px;font-weight:bold}
h1{font-size:clamp(34px,5vw,52px);line-height:1.15;margin:22px 0;color:#14284c}
h1 span{color:#1765db}
.hero p{font-size:16px;line-height:1.8;color:#627089;margin-bottom:25px}
.btn{display:inline-block;padding:13px 21px;background:#1765db;color:white;text-decoration:none;border-radius:9px;font-weight:bold;border:0;cursor:pointer}
.btn-light{background:white;color:#1765db;border:1px solid #cbdaf2;margin-left:8px}
.preview{flex:1;min-width:260px;background:white;padding:23px;border-radius:18px;box-shadow:0 15px 45px #173b7015}
.preview h3{margin-bottom:20px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#f3f7ff;padding:18px;border-radius:12px}
.stat small{color:#71809b}
.stat strong{display:block;font-size:24px;margin-top:9px;color:#1765db}
section.features{padding:55px 7%;text-align:center}
.features h2{font-size:30px;margin-bottom:12px}
.sub{color:#758198;line-height:1.7;margin-bottom:30px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;text-align:left}
.card{background:white;padding:24px;border-radius:14px;border:1px solid #e8edf5}
.icon{font-size:28px;margin-bottom:15px}
.card h3{margin-bottom:10px}
.card p{color:#71809b;line-height:1.7;font-size:14px}
.price{background:#fff;padding:35px 20px;text-align:center}
.price h2{margin-bottom:12px}
.price strong{font-size:34px;color:#1765db}
.price p{color:#71809b;margin:15px 0 22px}
footer{padding:25px;text-align:center;background:#14284c;color:#dce7fa;font-size:13px}
@media(max-width:600px){header{padding:16px 5%}nav a{margin-left:9px;font-size:12px}.hero{padding:45px 6%}.btn-light{margin:10px 0 0}.preview{min-width:100%}}
</style>
</head>
<body>
<header>
  <div class="logo">Bisni<span>vo</span></div>
